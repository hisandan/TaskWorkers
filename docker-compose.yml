services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: taskworkers
      POSTGRES_PASSWORD: taskworkers
      POSTGRES_DB: taskworkers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskworkers -d taskworkers"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
